<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Keuanganku</title>
<meta name="theme-color" content="#2E6B58">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Tata letak: ringkasan saldo di kolom samping (atas di HP), daftar catatan per tanggal di kolom utama, form sebagai lembar bawah. */
  :root {
    --bg: #F2F5F3;
    --surface: #FBFCFB;
    --ink: #232E28;
    --sub: #5A675F;
    --line: #DCE3DE;
    --accent: #3D7C69;
    --on-accent: #FFFFFF;
    --chip: #E7EDE9;
    --chip-on: #D3E6DC;
    --chip-on-ink: #1C3D31;
    --income: #2E7A57;
    --expense: #B4524A;
    --income-soft: #DCEDE3;
    --expense-soft: #F4DEDA;
    --scrim: rgba(20, 28, 24, 0.45);
    --shadow: 0 8px 24px rgba(30, 45, 38, 0.16);
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151A18;
      --surface: #1E2422;
      --ink: #E3EAE6;
      --sub: #9AA8A0;
      --line: #2C3531;
      --accent: #7CC1A5;
      --on-accent: #10231B;
      --chip: #2A322F;
      --chip-on: #2F4A40;
      --chip-on-ink: #D5EADF;
      --income: #6DC39A;
      --expense: #E49A90;
      --income-soft: #243A31;
      --expense-soft: #412B28;
      --scrim: rgba(0, 0, 0, 0.6);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151A18;
    --surface: #1E2422;
    --ink: #E3EAE6;
    --sub: #9AA8A0;
    --line: #2C3531;
    --accent: #7CC1A5;
    --on-accent: #10231B;
    --chip: #2A322F;
    --chip-on: #2F4A40;
    --chip-on-ink: #D5EADF;
    --income: #6DC39A;
    --expense: #E49A90;
    --income-soft: #243A31;
    --expense-soft: #412B28;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.5 var(--font);
    padding-block: 20px 120px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body.lock { overflow: hidden; }
  h1, h2, h3, p { margin: 0; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 560px; margin: 0 auto; }
  .top { display: flex; flex-direction: column; gap: 2px; margin-bottom: 16px; }
  .top h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .sync { font-size: 12px; color: var(--sub); min-height: 18px; }

  .layout { display: grid; gap: 16px; }
  .side { display: grid; gap: 12px; align-content: start; min-width: 0; }
  main { min-width: 0; }

  .balance {
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 20px;
    padding: 20px;
  }
  .balance .lbl { font-size: 13px; font-weight: 500; opacity: 0.85; }
  .balance .big {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 14px;
    min-width: 0;
  }
  .tile .lbl { font-size: 12px; color: var(--sub); }
  .tile .amt {
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .in { color: var(--income); }
  .out { color: var(--expense); }

  .seg {
    display: flex;
    gap: 4px;
    background: var(--chip);
    border-radius: 12px;
    padding: 4px;
  }
  .seg button {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--sub);
    padding: 9px 6px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 500;
  }
  .seg button.on {
    background: var(--surface);
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  }

  .group-h {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--sub);
    margin: 20px 2px 8px;
  }
  .group { display: grid; gap: 8px; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .row:hover { border-color: var(--accent); }
  .badge {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 500;
    line-height: 1;
  }
  .badge.in { background: var(--income-soft); }
  .badge.out { background: var(--expense-soft); }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .info .cat { font-weight: 600; font-size: 15px; }
  .info .note {
    font-size: 13px;
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .amount {
    flex: none;
    font-weight: 600;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }

  .empty {
    margin-top: 28px;
    padding: 28px 20px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 16px;
    color: var(--sub);
  }
  .empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 48px;
    padding: 0 20px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-weight: 600;
    font-size: 15px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.danger { color: var(--expense); }
  .btn.danger-solid { background: var(--expense); border-color: var(--expense); color: var(--bg); }
  .desk-only { display: none; }

  .fab {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    z-index: 5;
    box-shadow: var(--shadow);
    min-height: 52px;
    padding: 0 22px;
    border-radius: 18px;
  }

  .sheet-wrap {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: var(--scrim);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet {
    width: 100%;
    max-width: 520px;
    max-height: 94dvh;
    overflow-y: auto;
    background: var(--surface);
    color: var(--ink);
    border-radius: 22px 22px 0 0;
    padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    animation: up 0.2s ease-out;
  }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-head h2 { font-size: 18px; font-weight: 700; }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 0;
    background: var(--chip);
    font-size: 22px;
    line-height: 1;
  }
  form { display: grid; gap: 6px; }
  label, .field-label { font-size: 13px; color: var(--sub); font-weight: 500; margin-top: 10px; }
  .amount-box {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 14px;
    padding: 0 14px;
    min-height: 56px;
  }
  .amount-box:focus-within { border-color: var(--accent); }
  .amount-box span { color: var(--sub); font-weight: 600; }
  .amount-box input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    outline: none;
    padding: 8px 0;
  }
  .amount-box.bad { border-color: var(--expense); }
  .err { color: var(--expense); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--sub);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px;
  }
  .chip.on { background: var(--chip-on); color: var(--chip-on-ink); border-color: transparent; font-weight: 600; }
  input[type="date"], textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 12px;
    padding: 12px 14px;
    min-height: 48px;
  }
  textarea { resize: vertical; min-height: 84px; }
  input[type="date"]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions .primary { flex: 1; }
  .confirm {
    margin-top: 14px;
    padding: 14px;
    border: 1px solid var(--expense);
    border-radius: 14px;
    display: grid;
    gap: 10px;
  }
  .confirm div { display: flex; gap: 10px; }
  .confirm .btn { flex: 1; }

  .toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    z-index: 30;
    background: var(--ink);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 14px;
    max-width: calc(100% - 32px);
    text-align: center;
  }

  @media (min-width: 700px) {
    .sheet-wrap { align-items: center; }
    .sheet { border-radius: 22px; padding: 24px; box-shadow: var(--shadow); }
  }
  @media (min-width: 860px) {
    body { padding-block: 32px 48px; }
    .app { max-width: 980px; }
    .layout { grid-template-columns: 320px minmax(0, 1fr); gap: 28px; align-items: start; }
    .side { position: sticky; top: 20px; }
    .desk-only { display: inline-flex; }
    .fab { display: none; }
    .toast { bottom: 32px; }
    .group-h:first-child { margin-top: 4px; }
  }
</style>

<div class="app">
  <header class="top">
    <h1>Keuanganku</h1>
    <p class="sync" id="sync">Tersimpan di perangkat ini</p>
  </header>

  <div class="layout">
    <aside class="side">
      <section class="balance" aria-label="Ringkasan keuangan">
        <p class="lbl">Saldo</p>
        <p class="big" id="balance">Rp 0</p>
      </section>
      <div class="split">
        <div class="tile">
          <p class="lbl">Pemasukan</p>
          <p class="amt in" id="sumIn">Rp 0</p>
        </div>
        <div class="tile">
          <p class="lbl">Pengeluaran</p>
          <p class="amt out" id="sumOut">Rp 0</p>
        </div>
      </div>
      <button type="button" class="btn primary desk-only" id="addDesk">+ Catat transaksi</button>
    </aside>

    <main>
      <div class="seg" id="filters" role="group" aria-label="Tampilkan">
        <button type="button" data-f="all" class="on" aria-pressed="true">Semua</button>
        <button type="button" data-f="income" aria-pressed="false">Pemasukan</button>
        <button type="button" data-f="expense" aria-pressed="false">Pengeluaran</button>
      </div>
      <div id="list"></div>
    </main>
  </div>
</div>

<button type="button" class="btn primary fab" id="fab">+ Catat</button>

<div class="sheet-wrap" id="wrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Catat baru</h2>
      <button type="button" class="icon-btn" id="closeBtn" aria-label="Tutup">&times;</button>
    </div>
    <form id="form" novalidate>
      <div class="seg" id="typeSeg" role="group" aria-label="Jenis catatan">
        <button type="button" data-t="expense" class="on" aria-pressed="true">Pengeluaran</button>
        <button type="button" data-t="income" aria-pressed="false">Pemasukan</button>
      </div>

      <label for="amount">Jumlah</label>
      <div class="amount-box" id="amountBox">
        <span>Rp</span>
        <input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-describedby="amountErr">
      </div>
      <p class="err" id="amountErr" hidden>Isi jumlah lebih dari 0.</p>

      <span class="field-label" id="catLabel">Kategori</span>
      <div class="chips" id="cats" role="group" aria-labelledby="catLabel"></div>

      <label for="date">Tanggal</label>
      <input id="date" type="date">

      <label for="note">Catatan (opsional)</label>
      <textarea id="note" rows="3" maxlength="300" placeholder="Contoh: makan siang di kantin"></textarea>

      <div class="actions">
        <button type="button" class="btn danger" id="delBtn" hidden>Hapus</button>
        <button type="submit" class="btn primary" id="saveBtn">Simpan</button>
      </div>

      <div class="confirm" id="confirm" hidden>
        <p>Hapus catatan ini secara permanen?</p>
        <div>
          <button type="button" class="btn" id="cancelDel">Batal</button>
          <button type="button" class="btn danger-solid" id="okDel">Ya, hapus</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var LS_KEY = 'keuanganku.v1';
  var CATS = {
    expense: ['Makan', 'Transport', 'Belanja', 'Tagihan', 'Hiburan', 'Kesehatan', 'Pendidikan', 'Lainnya'],
    income: ['Uang saku', 'Gaji', 'Bonus', 'Usaha', 'Lainnya']
  };

  var items = [];
  var filter = 'all';
  var editing = null;
  var formType = 'expense';
  var formCat = CATS.expense[0];
  var col = null;           // koleksi db pribadi, null bila tidak tersedia
  var unsynced = {};        // id yang disimpan sebelum db siap
  var chain = Promise.resolve();
  var toastTimer = null;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // ---------- format ----------
  function dots(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function rupiah(n) { return 'Rp ' + dots(Math.abs(n)); }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function keyOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayKey() { return keyOf(new Date()); }
  function dayLabel(k) {
    var t = new Date();
    if (k === keyOf(t)) return 'Hari ini';
    t.setDate(t.getDate() - 1);
    if (k === keyOf(t)) return 'Kemarin';
    var p = k.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    try {
      return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) { return k; }
  }
  function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // ---------- penyimpanan lokal ----------
  function lsLoad() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function lsSave() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch (e) { /* abaikan */ }
  }

  // ---------- penyimpanan akun (db) ----------
  function body(it) {
    return { type: it.type, amount: it.amount, category: it.category, note: it.note, date: it.date, createdAt: it.createdAt };
  }
  function queue(fn) { chain = chain.then(fn).catch(function () {}); }
  function warnSave() { toast('Belum tersimpan di server. Salinan ada di perangkat ini.'); }
  function dbSave(it) {
    if (!col) { unsynced[it.id] = true; return; }
    queue(function () { return col.doc(it.id).set(body(it)).catch(warnSave); });
  }
  function dbRemove(id) {
    delete unsynced[id];
    if (!col) return;
    queue(function () { return col.doc(id).delete().catch(warnSave); });
  }

  function use(name) {
    try {
      if (window.claude && window.claude.use) return window.claude.use(name).catch(function () { return null; });
    } catch (e) { /* abaikan */ }
    return Promise.resolve(null);
  }

  function setSync(text) { $('sync').textContent = text; }

  async function connect() {
    var res = await Promise.all([use('db'), use('user')]);
    var db = res[0], user = res[1];
    if (!db || !user) return;
    var uid = await user.id();
    if (!uid) return;

    var c = db.collection('data/users/' + uid);
    var decided = false;
    var slow = setTimeout(function () {
      setSync('Server belum terjangkau, memakai salinan di perangkat ini');
    }, 10000);

    c.onSnapshot(function (snap) {
      var remote = snap.docs.map(function (d) {
        var o = d.data() || {};
        return { id: d.id, type: o.type, amount: o.amount, category: o.category, note: o.note || '', date: o.date, createdAt: o.createdAt || 0 };
      }).filter(function (t) { return (t.type === 'income' || t.type === 'expense') && t.amount > 0 && t.date; });

      var definitive = !snap.metadata.fromCache;
      if (!definitive && remote.length === 0) return;
      if (definitive) { clearTimeout(slow); setSync('Tersimpan otomatis di akunmu'); }

      if (!decided) {
        decided = true;
        col = c;
        // Pindahkan catatan lokal ke akun bila akun masih kosong.
        var local = lsLoad();
        if (definitive && remote.length === 0 && local.length) {
          items = local;
          render();
          local.forEach(function (t) { dbSave(t); });
          return;
        }
        // Unggah catatan yang dibuat sebelum db siap.
        Object.keys(unsynced).forEach(function (id) {
          var t = items.filter(function (x) { return x.id === id; })[0];
          if (t) dbSave(t);
        });
        unsynced = {};
      }
      items = remote;
      lsSave();
      render();
    }, function () {
      clearTimeout(slow);
      setSync('Server tidak bisa dijangkau, memakai salinan di perangkat ini');
    });
  }

  // ---------- tampilan ----------
  function render() {
    var inc = 0, exp = 0;
    items.forEach(function (t) { if (t.type === 'income') inc += t.amount; else exp += t.amount; });
    var bal = inc - exp;
    $('balance').textContent = (bal < 0 ? '−' : '') + rupiah(bal);
    $('sumIn').textContent = rupiah(inc);
    $('sumOut').textContent = rupiah(exp);

    var shown = items.filter(function (t) { return filter === 'all' || t.type === filter; });
    shown.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });

    var list = $('list');
    list.textContent = '';
    if (!shown.length) {
      var e = el('div', 'empty');
      e.appendChild(el('strong', null, items.length ? 'Tidak ada catatan di filter ini' : 'Belum ada catatan'));
      e.appendChild(el('span', null, items.length
        ? 'Pilih filter lain untuk melihat catatan.'
        : 'Pemasukan dan pengeluaranmu akan tampil di sini. Ketuk "Catat" untuk menambah yang pertama.'));
      list.appendChild(e);
      return;
    }

    var lastDate = null, group = null;
    shown.forEach(function (t) {
      if (t.date !== lastDate) {
        lastDate = t.date;
        list.appendChild(el('h3', 'group-h', dayLabel(t.date)));
        group = el('div', 'group');
        list.appendChild(group);
      }
      group.appendChild(rowFor(t));
    });
  }

  function rowFor(t) {
    var isIn = t.type === 'income';
    var cls = isIn ? 'in' : 'out';
    var sign = isIn ? '+' : '−';
    var b = el('button', 'row');
    b.type = 'button';
    b.appendChild(el('span', 'badge ' + cls, sign));
    var info = el('span', 'info');
    info.appendChild(el('span', 'cat', t.category));
    if (t.note) info.appendChild(el('span', 'note', t.note));
    b.appendChild(info);
    b.appendChild(el('span', 'amount ' + cls, sign + rupiah(t.amount)));
    b.addEventListener('click', function () { openSheet(t); });
    return b;
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2400);
  }

  // ---------- form ----------
  function syncType() {
    var btns = $('typeSeg').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-t') === formType;
      btns[i].classList.toggle('on', on);
      btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }
  function renderCats() {
    var box = $('cats');
    box.textContent = '';
    CATS[formType].forEach(function (name) {
      var b = el('button', 'chip' + (name === formCat ? ' on' : ''), name);
      b.type = 'button';
      b.setAttribute('aria-pressed', name === formCat ? 'true' : 'false');
      b.addEventListener('click', function () { formCat = name; renderCats(); });
      box.appendChild(b);
    });
  }
  function openSheet(t) {
    editing = t || null;
    formType = t ? t.type : 'expense';
    formCat = t ? t.category : CATS[formType][0];
    $('sheetTitle').textContent = t ? 'Ubah catatan' : 'Catat baru';
    $('amount').value = t ? dots(t.amount) : '';
    $('date').value = t ? t.date : todayKey();
    $('note').value = t ? t.note : '';
    $('delBtn').hidden = !t;
    $('confirm').hidden = true;
    $('amountErr').hidden = true;
    $('amountBox').classList.remove('bad');
    syncType();
    renderCats();
    $('wrap').hidden = false;
    document.body.classList.add('lock');
    if (!t) setTimeout(function () { $('amount').focus(); }, 60);
  }
  function closeSheet() {
    $('wrap').hidden = true;
    document.body.classList.remove('lock');
    editing = null;
  }

  function saveItem(it) {
    var idx = -1;
    for (var i = 0; i < items.length; i++) if (items[i].id === it.id) idx = i;
    if (idx >= 0) items[idx] = it; else items.push(it);
    lsSave();
    render();
    dbSave(it);
  }
  function removeItem(id) {
    items = items.filter(function (t) { return t.id !== id; });
    lsSave();
    render();
    dbRemove(id);
  }

  // ---------- peristiwa ----------
  $('fab').addEventListener('click', function () { openSheet(null); });
  $('addDesk').addEventListener('click', function () { openSheet(null); });
  $('closeBtn').addEventListener('click', closeSheet);
  $('wrap').addEventListener('click', function (e) { if (e.target === $('wrap')) closeSheet(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('wrap').hidden) closeSheet();
  });

  $('filters').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-f]');
    if (!b) return;
    filter = b.getAttribute('data-f');
    var btns = $('filters').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i] === b;
      btns[i].classList.toggle('on', on);
      btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    render();
  });

  $('typeSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-t]');
    if (!b) return;
    var t = b.getAttribute('data-t');
    if (t === formType) return;
    formType = t;
    formCat = CATS[t][0];
    syncType();
    renderCats();
  });

  $('amount').addEventListener('input', function () {
    var inp = $('amount');
    var v = inp.value;
    var pos = inp.selectionStart || 0;
    var before = v.slice(0, pos).replace(/\D/g, '').length;
    var digits = v.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 12);
    var f = dots(digits);
    inp.value = f;
    var np = 0, c = 0;
    while (np < f.length && c < before) { if (/\d/.test(f.charAt(np))) c++; np++; }
    try { inp.setSelectionRange(np, np); } catch (e) { /* abaikan */ }
    $('amountErr').hidden = true;
    $('amountBox').classList.remove('bad');
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var amt = parseInt($('amount').value.replace(/\D/g, '') || '0', 10);
    if (!amt || amt <= 0) {
      $('amountErr').hidden = false;
      $('amountBox').classList.add('bad');
      $('amount').focus();
      return;
    }
    var it = {
      id: editing ? editing.id : newId(),
      createdAt: editing ? editing.createdAt : Date.now(),
      type: formType,
      amount: amt,
      category: formCat,
      note: $('note').value.trim(),
      date: $('date').value || todayKey()
    };
    var wasEdit = !!editing;
    saveItem(it);
    closeSheet();
    toast(wasEdit ? 'Perubahan disimpan' : 'Catatan ditambahkan');
  });

  $('delBtn').addEventListener('click', function () { $('confirm').hidden = false; });
  $('cancelDel').addEventListener('click', function () { $('confirm').hidden = true; });
  $('okDel').addEventListener('click', function () {
    if (editing) removeItem(editing.id);
    closeSheet();
    toast('Catatan dihapus');
  });

  // ---------- mulai ----------
  items = lsLoad();
  render();
  connect().catch(function () { /* tetap pakai penyimpanan lokal */ });
})();
</script>

</body>
</html>
