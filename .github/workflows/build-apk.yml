name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nama rilis, contoh v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang paket
        run: |
          npm install
          npx expo install expo-asset expo-system-ui
          npx expo install --fix

      - name: Buat proyek Android
        run: npx expo prebuild -p android --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Siapkan file APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Keuanganku-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Keuanganku-apk
          path: dist/*.apk

      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "dist/Keuanganku-${TAG}.apk" \
            --title "Keuanganku ${TAG}" \
            --notes "APK Keuanganku. Unduh file .apk lalu pasang di HP Android." \
            --target "$GITHUB_SHA" \
          || gh release upload "$TAG" "dist/Keuanganku-${TAG}.apk" --clobber
